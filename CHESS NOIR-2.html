<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020203">
<title>CHESS NOIR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>:root {
  --ts: 1;
  --ink: #ece9e2; --ink2: rgba(236, 233, 226, .66); --ink3: rgba(236, 233, 226, .42);
  --accent: #e6dcc4; --accent2: #b9ae95; --danger: #e0806d; --good: #a8c7a0; --cool: #a8bde0;
  --glass-bg: linear-gradient(160deg, rgba(255,255,255,.115), rgba(255,255,255,.04) 42%, rgba(255,255,255,.055));
  --glass-blur: 24px;
  --sheen: 135deg;
  --spring: cubic-bezier(.34, 1.36, .64, 1);
  --spring-soft: cubic-bezier(.22, 1.12, .36, 1);
  --ease: cubic-bezier(.2, .7, .1, 1);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --r-lg: 24px; --r-md: 16px; --r-sm: 11px;
}
html { font-size: calc(16px * var(--ts)); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #020203; color: var(--ink);
  font-family: 'Inter', 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'ss01', 'cv11';
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Liquid Glass ---------- */
.glass { position: relative; background: var(--glass-bg); border-radius: var(--r-lg);
  backdrop-filter: blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.20), inset 0 -1px 0 rgba(255,255,255,.04), inset 0 0 0 1px rgba(255,255,255,.075), 0 24px 60px -12px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.25); }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(var(--sheen), rgba(255,255,255,.42), rgba(255,255,255,.04) 28%, rgba(255,255,255,0) 60%, rgba(255,255,255,.16));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .8; }
.glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 60% at 20% -10%, rgba(255,255,255,.10), transparent 60%); mix-blend-mode: screen; }
body.low-glass .glass { backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%); }

.pill { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: 0 1.25rem; border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.10), 0 8px 24px -8px rgba(0,0,0,.6);
  font-weight: 500; letter-spacing: .02em; font-size: .95rem; transition: transform .45s var(--spring), background .3s, opacity .3s; }
.pill:active, .pill.pressed { transform: scale(.95); }
.pill.primary { background: linear-gradient(180deg, rgba(236,228,208,.95), rgba(196,186,160,.92)); color: #141414; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 10px 30px -8px rgba(230,220,196,.35); }
.pill.ghost { background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
.pill.danger { color: #ffd9d0; box-shadow: inset 0 0 0 1px rgba(224,128,109,.45); }
.pill[disabled] { opacity: .35; pointer-events: none; }
.icon-btn { width: 52px; height: 52px; border-radius: 16px; display: inline-grid; place-items: center; color: var(--ink);
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 1px rgba(255,255,255,.08);
  transition: transform .45s var(--spring), opacity .3s, background .3s; position: relative; }
.icon-btn:active { transform: scale(.9); }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .lbl { position: absolute; bottom: -1.15rem; font-size: .62rem; color: var(--ink3); white-space: nowrap; letter-spacing: .02em; }
.icon-btn.on { background: linear-gradient(180deg, rgba(236,228,208,.30), rgba(236,228,208,.12)); }

.eyebrow { font-size: .68rem; letter-spacing: .28em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }
h1, h2, h3 { margin: 0; font-weight: 500; letter-spacing: -.01em; }

/* ---------- Intro ---------- */
#intro { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; }
#intro .title { position: absolute; top: 15%; left: 0; right: 0; text-align: center; opacity: 0; filter: blur(14px); transform: translateY(14px) scale(.98);
  transition: opacity 1.4s var(--ease), filter 1.6s var(--ease), transform 1.6s var(--ease), letter-spacing 2.2s var(--ease); }
#intro .title h1 { font-size: clamp(2.6rem, 7.4vw, 6.2rem); font-weight: 200; letter-spacing: .32em; margin-right: -.32em;
  background: linear-gradient(100deg, #8d8a85 10%, #f6f2ea 35%, #fffdf8 50%, #a8a49c 72%, #e9e4d9 90%); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 7s linear infinite; }
#intro .title p { margin: 1.1rem 0 0; font-size: .78rem; letter-spacing: .5em; color: var(--ink3); text-transform: uppercase; margin-right: -.5em; }
#intro.show-title .title { opacity: 1; filter: blur(0); transform: none; }
#intro.show-title .title h1 { letter-spacing: .24em; margin-right: -.24em; }
@keyframes sheen { 0% { background-position: 120% 0; } 100% { background-position: -100% 0; } }
#intro .play { position: absolute; bottom: calc(7% + var(--sab)); pointer-events: auto; min-width: 210px; min-height: 60px; font-size: 1rem; letter-spacing: .38em; padding-left: 1.7rem;
  opacity: 0; transform: translateY(24px) scale(.9); transition: opacity .9s var(--ease), transform .9s var(--spring); }
#intro.show-play .play { opacity: 1; transform: none; }
#intro .hint { position: absolute; bottom: calc(3% + var(--sab)); font-size: .74rem; color: var(--ink3); letter-spacing: .14em; transition: opacity 1s; display: flex; gap: 1.2rem; align-items: center; }
#intro .dots { display: flex; gap: 6px; }
#intro .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); transition: width .5s var(--spring), background .4s; }
#intro .dots i.on { width: 20px; background: rgba(255,255,255,.7); }
#intro .loading { position: absolute; top: 58%; font-size: .72rem; letter-spacing: .3em; color: var(--ink3); text-transform: uppercase; transition: opacity .8s; }
#intro .skip { position: absolute; top: calc(18px + var(--sat)); right: calc(18px + var(--sar)); pointer-events: auto; min-height: 40px; font-size: .78rem; opacity: .7; }

/* ---------- Generic panels / menu ---------- */
#menu { position: fixed; pointer-events: none; display: flex; }
body.o-land #menu { left: calc(28px + var(--sal)); top: calc(24px + var(--sat)); bottom: calc(24px + var(--sab)); width: min(440px, 40vw); align-items: center; }
body.o-port #menu { left: calc(16px + var(--sal)); right: calc(16px + var(--sar)); bottom: calc(16px + var(--sab)); height: 56%; align-items: flex-end; }
#menu .sheet { pointer-events: auto; width: 100%; max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  transition: opacity .6s var(--ease), transform .8s var(--spring), height .55s var(--spring-soft); transform-origin: 50% 80%; }
#menu.off .sheet { opacity: 0; transform: translateX(-30px) scale(.94); pointer-events: none; }
body.o-port #menu.off .sheet { transform: translateY(40px) scale(.96); }
.page { padding: 1.6rem 1.6rem 1.4rem; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: thin; }
.page-enter { animation: pageIn .62s var(--spring) both; }
.page-back { animation: pageBack .62s var(--spring) both; }
@keyframes pageIn { from { opacity: 0; transform: translateX(28px) scale(.98); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes pageBack { from { opacity: 0; transform: translateX(-28px) scale(.98); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.page-head { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.2rem; }
.page-head h2 { font-size: 1.45rem; font-weight: 500; }
.back { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: transform .45s var(--spring); flex: none; }
.back:active { transform: scale(.9); }
.brand { margin-bottom: 1.6rem; }
.brand h1 { font-size: 1.9rem; font-weight: 200; letter-spacing: .3em; }
.brand p { color: var(--ink3); font-size: .78rem; margin: .45rem 0 0; letter-spacing: .08em; }
.menu-list { display: flex; flex-direction: column; gap: .55rem; }
.menu-item { display: flex; align-items: center; gap: 1rem; text-align: left; padding: .95rem 1.05rem; border-radius: var(--r-md); min-height: 64px;
  background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform .5s var(--spring), background .3s; width: 100%; }
.menu-item:active { transform: scale(.975); }
.menu-item.primary { background: linear-gradient(180deg, rgba(236,228,208,.22), rgba(236,228,208,.08)); box-shadow: inset 0 0 0 1px rgba(236,228,208,.28), inset 0 1px 0 rgba(255,255,255,.2); }
.menu-item .mi-ic { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.06); }
.menu-item .mi-ic svg { width: 22px; height: 22px; }
.menu-item .mi-t { flex: 1; min-width: 0; }
.menu-item b { display: block; font-weight: 500; font-size: 1rem; letter-spacing: .01em; }
.menu-item small { display: block; color: var(--ink3); font-size: .78rem; margin-top: .2rem; line-height: 1.35; }
.menu-item .num { font-size: .7rem; letter-spacing: .2em; color: var(--ink3); font-weight: 600; }
.menu-item .chev { color: var(--ink3); }
.menu-item.done .mi-ic { background: rgba(168,199,160,.18); color: var(--good); }

.section { margin: 1.15rem 0 .55rem; }
.section > label, .field-label { display: block; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink3); font-weight: 600; margin-bottom: .55rem; }
.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg button { min-height: 44px; padding: 0 .95rem; border-radius: 12px; font-size: .86rem; color: var(--ink2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: transform .45s var(--spring), background .25s, color .25s; }
.seg button:active { transform: scale(.94); }
.seg button.on { background: linear-gradient(180deg, rgba(236,228,208,.92), rgba(200,190,166,.9)); color: #151515; box-shadow: inset 0 1px 0 rgba(255,255,255,.6); font-weight: 600; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: .45rem; }
.levels button { min-height: 66px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; transition: transform .45s var(--spring), background .25s; }
.levels button b { font-size: 1.15rem; font-weight: 300; }
.levels button small { font-size: .6rem; color: var(--ink3); letter-spacing: .02em; }
.levels button.on { background: linear-gradient(180deg, rgba(236,228,208,.9), rgba(196,186,160,.88)); color: #151515; }
.levels button.on small { color: rgba(0,0,0,.6); }
.note { font-size: .78rem; color: var(--ink3); line-height: 1.5; margin: .7rem 0 0; }
.note b { color: var(--ink2); font-weight: 500; }
.engine-status { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--ink2); padding: .7rem .85rem; border-radius: 12px; background: rgba(255,255,255,.04); margin-top: .7rem; line-height: 1.4; }
.engine-status i { width: 8px; height: 8px; border-radius: 4px; flex: none; background: var(--ink3); }
.engine-status i.ok { background: var(--good); box-shadow: 0 0 10px rgba(168,199,160,.7); }
.engine-status i.load { background: var(--accent); animation: blink 1s infinite; }
.engine-status i.bad { background: var(--danger); }
@keyframes blink { 50% { opacity: .3; } }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.actions { display: flex; gap: .6rem; margin-top: 1.4rem; }
.actions .pill { flex: 1; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .6rem 0; min-height: 52px; font-size: .92rem; border-bottom: 1px solid rgba(255,255,255,.05); width: 100%; text-align: left; }
.toggle small { display: block; font-size: .74rem; color: var(--ink3); margin-top: .15rem; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.12); position: relative; flex: none; transition: background .3s; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #e9e6df; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .5s var(--spring); }
.toggle.on .switch { background: rgba(230,220,196,.75); }
.toggle.on .switch::after { transform: translateX(20px); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; touch-action: pan-x; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 12px; margin-top: -10px; background: #ece8df; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 12px; background: #ece8df; border: 0; }
.slider-row { display: grid; grid-template-columns: 7rem 1fr 3rem; gap: .7rem; align-items: center; font-size: .86rem; color: var(--ink2); }
.slider-row output { text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; font-size: .8rem; }
textarea, input[type=text] { width: 100%; font: inherit; font-size: .82rem; color: var(--ink); background: rgba(0,0,0,.35); border: 0; border-radius: 12px; padding: .8rem .9rem;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); resize: vertical; user-select: text; -webkit-user-select: text; touch-action: auto; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
textarea { min-height: 120px; }
.err { color: #ffb4a3; font-size: .8rem; margin-top: .5rem; min-height: 1em; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: .55rem; }
.theme-card { border-radius: 16px; padding: .7rem; text-align: left; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); transition: transform .5s var(--spring), box-shadow .3s; min-height: 108px; display: flex; flex-direction: column; justify-content: space-between; gap: .5rem; }
.theme-card:active { transform: scale(.96); }
.theme-card.on { box-shadow: inset 0 0 0 2px rgba(236,228,208,.85); }
.theme-card .sw { display: grid; grid-template-columns: repeat(4, 1fr); height: 36px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.theme-card b { font-size: .86rem; font-weight: 500; }
.theme-card small { font-size: .66rem; color: var(--ink3); display: block; margin-top: .1rem; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; display: grid; gap: 14px;
  padding: calc(16px + var(--sat)) calc(18px + var(--sar)) calc(16px + var(--sab)) calc(18px + var(--sal)); opacity: 0; transition: opacity .7s var(--ease); }
#hud.on { opacity: 1; }
#hud:not(.on) { visibility: hidden; transition: opacity .5s var(--ease), visibility 0s .5s; }
#hud:not(.on) > * { pointer-events: none !important; }
#hud > * { pointer-events: auto; min-width: 0; min-height: 0; }
body.o-land #hud { grid-template-columns: minmax(230px, 270px) 1fr minmax(240px, 290px); grid-template-rows: auto 1fr auto;
  grid-template-areas: "cardT stage moves" "status stage moves" "cardB ctrl moves"; }
body.o-port #hud { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto auto auto;
  grid-template-areas: "cardT" "stage" "moves" "cardB" "ctrl"; }
#stage { grid-area: stage; pointer-events: none !important; }
.card-t { grid-area: cardT; } .card-b { grid-area: cardB; } #status { grid-area: status; } #moves { grid-area: moves; } #ctrl { grid-area: ctrl; }
body.o-port #status { grid-area: stage; align-self: start; justify-self: center; margin-top: 4px; }
.pcard { padding: .9rem 1rem; display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .8rem; align-items: center; transition: transform .6s var(--spring), box-shadow .5s; }
.pcard .av { grid-row: span 2; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: rgba(255,255,255,.06); }
.pcard .av svg { width: 30px; height: 30px; }
.pcard .nm { font-weight: 500; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .sub { font-size: .7rem; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: .4rem; align-items: center; min-height: 1.1rem; }
.pcard .clock { grid-row: span 2; font-variant-numeric: tabular-nums; font-size: 1.55rem; font-weight: 300; letter-spacing: .02em; padding: .3rem .7rem; border-radius: 12px; transition: background .4s, color .4s; min-width: 5.2ch; text-align: center; }
.pcard.active { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(236,228,208,.38), 0 24px 60px -12px rgba(0,0,0,.6); }
.pcard.active .clock { background: rgba(236,228,208,.92); color: #121212; }
.pcard.low .clock { background: rgba(224,128,109,.9); color: #160b08; }
.pcard .caps { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0; min-height: 20px; align-items: center; margin-top: .35rem; }
.pcard .caps svg { width: 17px; height: 17px; margin-right: -4px; }
.pcard .caps .adv { margin-left: .55rem; font-size: .72rem; color: var(--ink2); }
.thinking { display: inline-flex; gap: 3px; align-items: center; }
.thinking i { width: 4px; height: 4px; border-radius: 2px; background: var(--accent); animation: think 1.1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
#status { padding: .75rem 1rem; font-size: .84rem; display: flex; flex-direction: column; gap: .4rem; align-self: center; }
#status .turn { display: flex; align-items: center; gap: .55rem; font-weight: 500; }
#status .turn i { width: 10px; height: 10px; border-radius: 5px; box-shadow: 0 0 0 1px rgba(255,255,255,.4); }
#status .meta { color: var(--ink3); font-size: .74rem; line-height: 1.4; }
#status .claim { margin-top: .2rem; }
body.o-port #status { flex-direction: row; align-items: center; padding: .45rem .9rem; border-radius: 999px; gap: .8rem; }
body.o-port #status .meta { display: none; }
#moves { display: flex; flex-direction: column; overflow: hidden; }
#moves .mv-head { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1rem .5rem; }
#moves .mv-list { flex: 1; overflow-y: auto; padding: 0 .6rem .6rem; touch-action: pan-y; overscroll-behavior: contain; font-variant-numeric: tabular-nums; }
.mv-row { display: grid; grid-template-columns: 2.4rem 1fr 1fr; align-items: center; font-size: .9rem; }
.mv-row .n { color: var(--ink3); font-size: .74rem; padding-left: .4rem; }
.mv { text-align: left; padding: .45rem .55rem; border-radius: 9px; min-height: 38px; transition: background .2s; display: flex; align-items: center; gap: .35rem; }
.mv.cur { background: rgba(236,228,208,.18); }
.mv.view { box-shadow: inset 0 0 0 1px rgba(236,228,208,.6); }
.mv .tag { font-size: .62rem; padding: .1rem .35rem; border-radius: 6px; font-weight: 600; letter-spacing: .03em; }
.tag.best { background: rgba(168,199,160,.2); color: #cfe6c9; } .tag.good { background: rgba(255,255,255,.08); color: var(--ink2); }
.tag.inacc { background: rgba(230,210,140,.18); color: #f0dfa0; } .tag.mistake { background: rgba(240,160,100,.2); color: #f5c19a; } .tag.blunder { background: rgba(224,110,95,.25); color: #ffb4a3; }
#moves .mv-tools { display: flex; gap: .4rem; padding: .6rem; border-top: 1px solid rgba(255,255,255,.06); flex-wrap: wrap; }
#moves .mv-tools .pill { min-height: 40px; font-size: .78rem; padding: 0 .8rem; flex: 1; }

<script id="src-core">/* ==========================================================================
   CHESS NOIR — Rules Core (0x88)
   Shared by the main thread and the AI worker (worker source is built from
   this script's text, so it must stay self-contained and side-effect free).
   ========================================================================== */
var NoirChess = (function () {
  'use strict';
  var WHITE = 0, BLACK = 8;
  var PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
  var F_CAPTURE = 1, F_DOUBLE = 2, F_EP = 4, F_CK = 8, F_CQ = 16, F_PROMO = 32;
  var START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

  var N_OFF = [33, 31, 18, 14, -33, -31, -18, -14];
  var B_OFF = [17, 15, -17, -15];
  var R_OFF = [16, 1, -16, -1];
  var K_OFF = [17, 15, -17, -15, 16, 1, -16, -1];

  function mkMove(from, to, promo, flags) { return from | (to << 7) | (promo << 14) | (flags << 17); }
  function mFrom(m) { return m & 127; }
  function mTo(m) { return (m >> 7) & 127; }
  function mPromo(m) { return (m >> 14) & 7; }
  function mFlags(m) { return (m >> 17) & 63; }

  function sqFile(s) { return s & 7; }
  function sqRank(s) { return s >> 4; }
  function sqName(s) { return 'abcdefgh'[s & 7] + ((s >> 4) + 1); }
  function parseSq(n) {
    if (!n || n.length !== 2) return -1;
    var f = n.charCodeAt(0) - 97, r = n.charCodeAt(1) - 49;
    if (f < 0 || f > 7 || r < 0 || r > 7) return -1;
    return r * 16 + f;
  }

  // ---- Zobrist (two independent 32-bit keys => ~64-bit identity) ----
  var seed = 0x9E3779B9 | 0;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
  var Z1 = new Int32Array(16 * 128), Z2 = new Int32Array(16 * 128);
  for (var i = 0; i < 16 * 128; i++) { Z1[i] = rnd(); Z2[i] = rnd(); }
  var ZS1 = rnd(), ZS2 = rnd();
  var ZC1 = new Int32Array(16), ZC2 = new Int32Array(16);
  for (i = 0; i < 16; i++) { ZC1[i] = rnd(); ZC2[i] = rnd(); }
  var ZE1 = new Int32Array(8), ZE2 = new Int32Array(8);
  for (i = 0; i < 8; i++) { ZE1[i] = rnd(); ZE2[i] = rnd(); }

  var CASTLE_MASK = new Int32Array(128);
  for (i = 0; i < 128; i++) CASTLE_MASK[i] = 15;
  CASTLE_MASK[4] = 15 & ~3; CASTLE_MASK[7] = 15 & ~1; CASTLE_MASK[0] = 15 & ~2;
  CASTLE_MASK[116] = 15 & ~12; CASTLE_MASK[119] = 15 & ~4; CASTLE_MASK[112] = 15 & ~8;

  var PIECE_FROM_CHAR = { p: PAWN, n: KNIGHT, b: BISHOP, r: ROOK, q: QUEEN, k: KING };
  var CHAR_FROM_TYPE = ' pnbrqk';

  function Position(fen) {
    this.board = new Int8Array(128);
    this.stack = [];
    this.keys1 = []; this.keys2 = [];
    this.lessonMode = false;
    this.load(fen || START_FEN);
  }

  Position.prototype.load = function (fen) {
    var parts = String(fen).trim().split(/\s+/);
    if (parts.length < 4) throw new Error('FEN 필드가 부족합니다');
    var rows = parts[0].split('/');
    if (rows.length !== 8) throw new Error('FEN 행 수가 8이 아닙니다');
    var b = this.board; b.fill(0);
    var kings = [-1, -1], kc = [0, 0];
    for (var r = 0; r < 8; r++) {
      var rank = 7 - r, f = 0, row = rows[r];
      for (var j = 0; j < row.length; j++) {
        var c = row[j];
        if (c >= '1' && c <= '8') { f += +c; continue; }
        var t = PIECE_FROM_CHAR[c.toLowerCase()];
        if (!t || f > 7) throw new Error('FEN 기물 오류: ' + c);
        var col = (c === c.toLowerCase()) ? BLACK : WHITE;
        if (t === PAWN && (rank === 0 || rank === 7)) throw new Error('폰이 첫/마지막 랭크에 있습니다');
        b[rank * 16 + f] = t | col;
        if (t === KING) { kings[col ? 1 : 0] = rank * 16 + f; kc[col ? 1 : 0]++; }
        f++;
      }
      if (f !== 8) throw new Error('FEN 행 길이 오류');
    }
    if (kc[0] > 1 || kc[1] > 1) throw new Error('킹이 둘 이상입니다');
    if (parts[1] !== 'w' && parts[1] !== 'b') throw new Error('FEN 차례 오류');
    this.turn = parts[1] === 'w' ? WHITE : BLACK;
    var cs = 0, cr = parts[2];
    if (cr !== '-') {
      if (cr.indexOf('K') >= 0 && b[4] === KING && b[7] === ROOK) cs |= 1;
      if (cr.indexOf('Q') >= 0 && b[4] === KING && b[0] === ROOK) cs |= 2;
      if (cr.indexOf('k') >= 0 && b[116] === (KING | BLACK) && b[119] === (ROOK | BLACK)) cs |= 4;
      if (cr.indexOf('q') >= 0 && b[116] === (KING | BLACK) && b[112] === (ROOK | BLACK)) cs |= 8;
    }
    this.castling = cs;
    this.ep = parts[3] === '-' ? -1 : parseSq(parts[3]);
    if (this.ep >= 0) {
      var er = sqRank(this.ep);
      if ((this.turn === WHITE && er !== 5) || (this.turn === BLACK && er !== 2)) this.ep = -1;
    }
    this.half = parts.length > 4 ? (parseInt(parts[4], 10) || 0) : 0;
    this.full = parts.length > 5 ? Math.max(1, parseInt(parts[5], 10) || 1) : 1;
    this.kingSq = kings;
    this.stack.length = 0;
    this.lessonMode = kc[0] === 0 || kc[1] === 0;
    if (!this.lessonMode) {
      // side not to move must not be in check
      var other = this.turn ^ 8;
      if (this.attacked(this.kingSq[other ? 1 : 0], this.turn)) throw new Error('차례가 아닌 쪽의 킹이 체크 상태입니다');
    }
    this.computeHash();
    this.keys1 = [this.h1]; this.keys2 = [this.h2];
    this.startFen = this.fen();
  };

  Position.prototype.epKeyFile = function () {
    // en-passant only counts for identity when a capture is pseudo-possible
    var ep = this.ep; if (ep < 0) return -1;
    var pawn = PAWN | this.turn;
    var src = this.turn === WHITE ? ep - 16 : ep + 16;
    if (((src - 1) & 0x88) === 0 && this.board[src - 1] === pawn) return ep & 7;
    if (((src + 1) & 0x88) === 0 && this.board[src + 1] === pawn) return ep & 7;
    return -1;
  };

  Position.prototype.computeHash = function () {
    var h1 = 0, h2 = 0, b = this.board;
    for (var s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      var p = b[s]; if (p) { h1 ^= Z1[p * 128 + s]; h2 ^= Z2[p * 128 + s]; }
    }
    if (this.turn === BLACK) { h1 ^= ZS1; h2 ^= ZS2; }
    h1 ^= ZC1[this.castling]; h2 ^= ZC2[this.castling];
    this.h1 = h1; this.h2 = h2;
    // ep identity is mixed in only for repetition keys (see key())
  };
  Position.prototype.key1 = function () { var f = this.epKeyFile(); return f >= 0 ? (this.h1 ^ ZE1[f]) : this.h1; };
  Position.prototype.key2 = function () { var f = this.epKeyFile(); return f >= 0 ? (this.h2 ^ ZE2[f]) : this.h2; };

  Position.prototype.attacked = function (sq, by) {
    if (sq < 0) return false;
    var b = this.board, t, i, s, p;
    if (by === WHITE) {
      s = sq - 15; if (!(s & 0x88) && b[s] === PAWN) return true;
      s = sq - 17; if (!(s & 0x88) && b[s] === PAWN) return true;
    } else {
      s = sq + 15; if (!(s & 0x88) && b[s] === (PAWN | BLACK)) return true;
      s = sq + 17; if (!(s & 0x88) && b[s] === (PAWN | BLACK)) return true;
    }
    for (i = 0; i < 8; i++) {
      s = sq + N_OFF[i]; if (!(s & 0x88) && b[s] === (KNIGHT | by)) return true;
      s = sq + K_OFF[i]; if (!(s & 0x88) && b[s] === (KING | by)) return true;
    }
    for (i = 0; i < 4; i++) {
      var d = B_OFF[i]; s = sq + d;
      while (!(s & 0x88)) {
        p = b[s];
        if (p) { if ((p & 8) === by) { t = p & 7; if (t === BISHOP || t === QUEEN) return true; } break; }
        s += d;
      }
      d = R_OFF[i]; s = sq + d;
      while (!(s & 0x88)) {
        p = b[s];
        if (p) { if ((p & 8) === by) { t = p & 7; if (t === ROOK || t === QUEEN) return true; } break; }
        s += d;
      }
    }
    return false;
  };

  Position.prototype.inCheck = function (color) {
    if (color === undefined) color = this.turn;
    return this.attacked(this.kingSq[color ? 1 : 0], color ^ 8);
  };

  // Pseudo-legal move generation. capturesOnly also includes promotions.

function onMenuClick(e) {
  var b = e.target.closest('button'); if (!b) return;
  Sound.init(); Sound.play('ui'); haptic(5);
  var act = b.dataset.act;
  if (b.dataset.cfg) {
    var v = b.dataset.val; newCfg[b.dataset.cfg] = isNaN(+v) || b.dataset.cfg === 'color' || b.dataset.cfg === 'tc' ? v : +v; saveCfg();
    rerenderMenuInPlace(); return;
  }
  if (b.dataset.set || b.dataset.toggle) { handleSettingClick(b); rerenderMenuInPlace(); return; }
  if (!act) return;
  if (act === 'back') return menuBack();
  if (act.indexOf('go:') === 0) return renderMenu(act.slice(3));
  if (act === 'continue') return continueGame();
  if (act === 'start-ai' || act === 'start-local') {
    var tc = tcFromCfg(), human = newCfg.color === 'r' ? (Math.random() < 0.5 ? C.WHITE : C.BLACK) : (newCfg.color === 'b' ? C.BLACK : C.WHITE);
    var cfg = { mode: act === 'start-ai' ? 'ai' : 'local', human: human, level: newCfg.level, tc: tc, startFen: App.pendingFen || C.START_FEN };
    if (cfg.mode === 'local') { cfg.white = newCfg.wName || '백'; cfg.black = newCfg.bName || '흑'; }
    App.pendingFen = null;
    return startMatch(cfg);
  }
  if (act === 'lesson') return Academy.start(+b.dataset.i);
  if (act.indexOf('rec-') === 0) return savedAction(act.slice(4), b.dataset.id);
  if (act === 'imp-fen') {
    var t = $('#imp-ta').value.trim(), err = $('#imp-err');
    try { var p = new C.Position(t); if (p.lessonMode) throw new Error('양쪽 킹이 모두 있어야 합니다'); var st = p.status(); if (st.over) throw new Error('이미 끝난 포지션입니다 (' + reasonKo(st.reason) + ')'); App.pendingFen = p.fen(); renderMenu('mode'); }
    catch (ex) { err.textContent = 'FEN 오류: ' + ex.message; }
    return;
  }
  if (act === 'imp-pgn') {
    try {
      var g = C.parsePGN($('#imp-ta').value);
      if (!g.uci.length) throw new Error('수가 없습니다');
      var rec = { id: uid(), date: Date.now(), white: g.headers.White || '백', black: g.headers.Black || '흑', mode: 'import', result: g.result, reason: g.result === '*' ? '' : 'imported', startFen: g.startFen, moves: g.uci, sans: g.san };
      var list = Store.get(KEY.saved, []); list.push(rec); Store.set(KEY.saved, list.slice(-60));
      openViewer(rec, 'replay', 0);
    } catch (ex) { $('#imp-err').textContent = ex.message; }
  }
}

// ================================================================= MATCH
function rebuildPosition(rec) {
  var p = new C.Position(rec.startFen || C.START_FEN);
  (rec.moves || []).forEach(function (u) { var m = p.moveFromUci(u); if (!m) throw new Error('bad move ' + u); p.make(m); });
  return p;
}
function newClock(tc) { return { base: tc.base, inc: tc.inc, w: tc.base || null, b: tc.base || null, running: null, stamp: 0 }; }
function startMatch(cfg) {
  leaveMenuSpin();
  match = App.match = {
    id: uid(), created: Date.now(), mode: cfg.mode, human: cfg.mode === 'ai' ? cfg.human : null, level: cfg.level || 3,
    tc: cfg.tc, startFen: cfg.startFen || C.START_FEN, moves: [], sans: [], clocksHist: [], result: null, reason: null,
    white: cfg.white, black: cfg.black
  };
  if (match.mode === 'ai') {
    var aiName = 'AI · Lv.' + match.level;
    match.white = match.human === C.WHITE ? '플레이어' : aiName; match.black = match.human === C.BLACK ? '플레이어' : aiName;
  }
  pos = App.pos = new C.Position(match.startFen);
  match.clock = newClock(match.tc);

}
function continueGame() {
  var rec = Store.get(KEY.current, null); if (!rec) return;
  try { var p = rebuildPosition(rec); } catch (e) { toast('저장된 대국을 복구할 수 없습니다', true); Store.del(KEY.current); renderMenu('main', true); return; }
  leaveMenuSpin();
  match = App.match = rec; pos = App.pos = p;
  match.clock = { base: rec.tc.base, inc: rec.tc.inc, w: rec.clockW, b: rec.clockB, running: null, stamp: 0 };
  match.clocksHist = rec.clocksHist || [];
  enterGame(false);
}
function enterGame(isNew) {
  setMode('game');
  App.review = null; App.aiBusy = false; App.aiToken++; App.started = false; App.pendingPromo = null; deselect();
  App.viewColor = match.mode === 'ai' ? match.human : (settings.autoRotate ? pos.turn : C.WHITE);
  App.cursor = App.viewColor === C.WHITE ? 0x14 : 0x64;
  var last = match.moves.length ? pos.stack[pos.stack.length - 1] : null;
  App.lastMove = last ? { from: C.mFrom(last.m), to: C.mTo(last.m) } : null;
  Scene.sync(pos, null);
  lights(LIGHT_PLAY); Scene.L.dim.set(0); Scene.envRotSpeed = 0.04;
  Scene.boardScale.set(1); Scene.boardY.set(0);
  Cam.resetUser();
  var cine = settings.cinematic !== 'off' && !settings.reduced;
  // establishing move: sweep over the board, then settle on the player's side
  if (cine && isNew) {
    Cam.setGoal({ az: viewAz(App.viewColor) + 0.5, el: 1.15, target: [0, 0, 0], fov: 0.55, fit: true, fitPad: 1.1, shift: true, speed: 0.32 });
    setTimeout(function () { if (App.mode === 'game') Cam.setGoal({ az: viewAz(App.viewColor), el: 0.92, fit: true, fitPad: 1, speed: 0.42 }); }, 900);
  } else Cam.setGoal({ az: viewAz(App.viewColor), el: 0.92, target: [0, 0, 0], fov: 0.55, fit: true, fitPad: 1, shift: true, speed: 0.5 });
  renderHUD();
  if (isNew) Sound.play('start');
  setTimeout(function () {
    if (App.mode !== 'game' || match.result) return;
    App.started = true; clockStart(); maybeAI(); renderHUD();
  }, isNew && cine ? 1300 : 500);
  saveCurrent();
}

// ---------------------------------------------------------------- clocks
function clockStart() { var c = match.clock; if (!c.base || match.result) return; settleClock(); c.running = pos.turn; c.stamp = nowMs(); }
function settleClock() {
  var c = match.clock; if (!c || c.running == null) return;
  var t = nowMs(), k = c.running === C.WHITE ? 'w' : 'b';
  c[k] -= t - c.stamp; c.stamp = t;
}
function clockPause() { var c = match && match.clock; if (!c) return; settleClock(); c.running = null; }
function clockLeft(color) {
  var c = match.clock; if (!c.base) return null;
  var k = color === C.WHITE ? 'w' : 'b', v = c[k];
  if (c.running === color) v -= nowMs() - c.stamp;
  return v;
}
function clockAfterMove(mover) {
  var c = match.clock; if (!c.base) return;
  settleClock();
  var k = mover === C.WHITE ? 'w' : 'b';
  if (match.moves.length > 0) c[k] += c.inc;
  c.running = mover ^ 8; c.stamp = nowMs();
}
function checkFlag() {
  if (!match || match.result || !match.clock.base || match.clock.running == null) return;
  var side = match.clock.running;
  if (clockLeft(side) <= 0) {
    settleClock(); match.clock[side === C.WHITE ? 'w' : 'b'] = 0;
    var opp = side ^ 8;
    if (pos.canMate(opp)) endGame(opp === C.WHITE ? '1-0' : '0-1', 'timeout');
    else endGame('1/2-1/2', 'timeoutDraw');
  }
}

// ---------------------------------------------------------------- persistence
function matchRecord(includeClock) {

  if (i >= 0) { rec.analysis = rec.analysis || list[i].analysis; list[i] = rec; } else list.push(rec);

function pgnOf(rec) {
  var d = new Date(rec.created || Date.now());

  var hd = { Event: rec.mode === 'ai' ? 'CHESS NOIR vs AI' : rec.mode === 'local' ? 'CHESS NOIR Local' : 'CHESS NOIR', Site: 'CHESS NOIR', Date: date, White: rec.white || 'White', Black: rec.black || 'Black' };
  if (rec.tc && rec.tc.base) hd.TimeControl = Math.round(rec.tc.base / 1000) + '+' + Math.round(rec.tc.inc / 1000);
  if (rec.reason) hd.Termination = reasonKo(rec.reason);

}

// ================================================================= GAME LOGIC
function canInteract() {

  if (App.mode === 'academy') return Academy.canMove();
  return false;
}
function sideCanMove(color) { return canInteract() && pos.turn === color; }
function select(v) {
  if (App.sel === v) return;
  deselect(true);
  App.sel = v; v.liftTarget = 0.14; v.sel.set(0.55);
  App.selMoves = pos.legalMoves().filter(function (m) { return C.mFrom(m) === v.sq; });
  Sound.play('select'); haptic(6);
  if (settings.cinematic === 'full' && !settings.reduced && App.mode === 'game') Cam.setGoal({ target: [v.x * 0.06, 0, v.z * 0.06] });
  announce(colorKo(v.color) + ' ' + TYPE_KO[v.type] + ' ' + C.sqName(v.sq) + ' 선택, 이동 가능 ' + App.selMoves.length + '곳');
}
function deselect(keepCam) {
  if (App.sel) { App.sel.liftTarget = 0; App.sel.sel.set(0); if (App.sel.drag) { App.sel.drag = null; Scene.moveView(App.sel, App.sel.sq, { height: 0.06, durMul: 0.6 }); } }
  App.sel = null; App.selMoves = []; App.hover = -1;
  if (!keepCam && App.mode === 'game') Cam.setGoal({ target: [0, 0, 0] });
}
function targetsOf(moves) { var t = {}; moves.forEach(function (m) { t[C.mTo(m)] = m; }); return t; }
function tryUserMove(toSq, viaDrag) {
  var v = App.sel; if (!v) return false;
  var ms = App.selMoves.filter(function (m) { return C.mTo(m) === toSq; });
  if (!ms.length) { Sound.play('illegal'); haptic(20); return false; }
  if (ms.length > 1) { openPromotion(v, ms); return true; }
  v.liftTarget = 0; v.sel.set(0); v.drag = null;
  App.sel = null; App.selMoves = [];
  if (App.mode === 'game') Cam.setGoal({ target: [0, 0, 0] });

  return true;
}
function onUserMove(m) {
  if (App.mode === 'academy') Academy.userMove(m);
  else commitMove(m, {});
}

function checkersOf(p) {
  var c = p.clone(); c.makeNull();
  var ks = p.kingSq[p.turn ? 1 : 0], out = [];
  c.genPseudo([], true).forEach(function (m) { if (C.mTo(m) === ks) out.push(C.mFrom(m)); });
  return out;
}
function playCheckFx(p) {
  var ks = p.kingSq[p.turn ? 1 : 0]; if (ks < 0) return;
  var chk = checkersOf(p);
  App.checkFx = { king: ks, from: chk, t: 0 };
  Scene.glowPos = [sqX(ks), 0.55, sqZ(ks)];
  Scene.L.glow.v = 0; Scene.L.glow.set(1.4);
  setTimeout(function () { Scene.L.glow.set(0.35); }, 1100);
  chk.forEach(function (s) { var cv = Scene.findAt(s); if (cv) { cv.sel.v = 0.9; cv.sel.set(0); } });
  toast('CHECK'); Sound.play('check'); haptic(18);
  if (settings.cinematic === 'full' && !settings.reduced && App.mode === 'game') {
    Cam.setGoal({ target: [sqX(ks) * 0.14, 0, sqZ(ks) * 0.14] });
    Cam.uZoom.set(0.96);
    setTimeout(function () { if (App.mode === 'game') { Cam.setGoal({ target: [0, 0, 0] }); Cam.uZoom.set(Cam.uZoomUser || 1); } }, 900);
  }
}
function commitMove(m, opt) {
  var legal = pos.legalMoves();
  if (legal.indexOf(m) < 0) return false;
  var san = pos.san(m, legal), hint = pos.describe(m), uci = pos.uci(m), mover = pos.turn;
  match.clocksHist.push({ w: clockLeft(C.WHITE), b: clockLeft(C.BLACK) });
  clockAfterMove(mover);
  pos.make(m);
  match.moves.push(uci); match.sans.push(san);
  App.lastMove = { from: hint.from, to: hint.to }; App.checkFx = null; Scene.L.glow.set(0);
  App.lastMoveTime = nowMs();
  var st = pos.status();
  Scene.sync(pos, hint, false, {
    onLand: function (v, cap) {
      Sound.play(cap ? 'capture' : 'move'); haptic(cap ? 14 : 7);
      if (st.check && !st.over) playCheckFx(pos);
    }
  });
  announce(colorKo(mover) + ' ' + san);
  if (st.over) endGame(st.result, st.reason);

}

}

  App.cursor = App.viewColor === C.WHITE ? 0x14 : 0x64; renderHUD();
}

// ---------------------------------------------------------------- AI
function maybeAI() {
  if (App.mode !== 'game' || !match || match.mode !== 'ai' || match.result || pos.turn === match.human || App.aiBusy || !App.started || App.review != null) return;
  App.aiBusy = true; var token = ++App.aiToken, t0 = nowMs();
  App.aiInfo = { depth: 0 };
  renderHUD();
  var left = clockLeft(pos.turn);
  Engines.think({
    startFen: match.startFen, moves: match.moves.slice(), level: match.level, timeLeft: left, purpose: 'move',
    onInfo: function (inf) { if (token === App.aiToken) { App.aiInfo = inf; renderStatusSoon(); } }
  }).then(function (res) {
    if (token !== App.aiToken || !res) return;
    var minWait = 420 + (match.level <= 2 ? 300 : 0);
    var animWait = Math.max(0, App.lastMoveTime + 650 / Math.max(0.5, animSpeed() || 2) - nowMs());
    var wait = Math.max(0, minWait - (nowMs() - t0), animWait);
    setTimeout(function () {
      if (token !== App.aiToken || App.mode !== 'game' || match.result) return;
      var m = res.move ? pos.moveFromUci(res.move) : 0;
      if (!m) { var l = pos.legalMoves(); m = l[0]; }
      App.aiBusy = false;
      App.aiInfo = res; match.lastEval = res.score; match.lastEngine = res.engine;
      commitMove(m, { ai: true });
    }, wait);
  }).catch(function (err) {
    if (token !== App.aiToken) return;
    App.aiBusy = false; toast('AI 오류: ' + err.message, true, 3000); renderHUD();
  });
}
function cancelAI() { if (App.aiBusy) { App.aiToken++; App.aiBusy = false; Engines.cancel(); } }

// ---------------------------------------------------------------- undo / draw / resign
function canUndo() {
  if (!match || match.result || App.mode !== 'game' || App.review != null) return false;
  if (match.mode === 'local') return match.moves.length > 0;
  // AI: there must be a human move to take back
  var humanMoves = 0, p = new C.Position(match.startFen);
  for (var i = 0; i < match.moves.length; i++) { if (p.turn === match.human) humanMoves++; p.turn ^= 8; }
  return humanMoves > 0;
}
function undoPly() {
  var u = pos.stack[pos.stack.length - 1]; if (!u) return;
  var prevPos = pos.clone(); prevPos.unmake();
  var hint = prevPos.describe(u.m);
  pos.unmake(); match.moves.pop(); match.sans.pop();
  var ch = match.clocksHist.pop();
  if (ch && match.clock.base) { match.clock.w = ch.w; match.clock.b = ch.b; }
  Scene.sync(pos, hint, true);
}
function doUndo() {
  if (!canUndo()) return;
  deselect(); closePromotion(true);
  if (match.mode === 'ai') {
    if (App.aiBusy) { cancelAI(); undoPly(); }
    else { undoPly(); if (pos.turn !== match.human && match.moves.length) undoPly(); }
  } else undoPly();
  var last = pos.stack[pos.stack.length - 1];
  App.lastMove = last ? { from: C.mFrom(last.m), to: C.mTo(last.m) } : null;
  App.checkFx = null; Scene.L.glow.set(0);
  if (match.clock.base) { match.clock.running = null; clockStart(); }
  if (pos.inCheck()) setTimeout(function () { playCheckFx(pos); }, 300);
  if (match.mode === 'local' && settings.autoRotate) rotateTo(pos.turn);
  Sound.play('ui'); renderHUD(); saveCurrent(); maybeAI();
}
function offerDraw() {
  if (!match || match.result) return;
  var st = pos.status();
  if (st.claimThreefold) return confirmDialog('무승부 신청', '같은 포지션이 3회 반복되었습니다. 규칙에 따라 무승부를 신청하시겠습니까?', '무승부 신청', function () { endGame('1/2-1/2', 'threefold'); });
  if (st.claimFifty) return confirmDialog('무승부 신청', '50수 동안 폰 이동과 기물 잡기가 없었습니다. 규칙에 따라 무승부를 신청하시겠습니까?', '무승부 신청', function () { endGame('1/2-1/2', 'fifty'); });
  if (match.mode === 'ai') {
    var ev = match.lastEval, plies = match.moves.length;
    var accept = ev != null && (ev <= -150 || (Math.abs(ev) <= 30 && plies >= 60));
    if (accept) { toast('AI가 무승부를 수락했습니다', true, 2200); setTimeout(function () { endGame('1/2-1/2', 'agreement'); }, 700); }
    else toast(ev == null ? 'AI가 아직 평가 전이라 제안을 거절했습니다' : 'AI가 엔진 평가(' + (ev > 0 ? '+' : '') + (ev / 100).toFixed(2) + ')를 근거로 거절했습니다', true, 2600);
    return;
  }

// ---------------------------------------------------------------- end of game

    resign: '기권', timeout: '시간 초과', timeoutDraw: '시간 초과 · 상대가 메이트 불가 → 무승부', imported: 'PGN', saved: '진행 중 저장'
  }[r] || r || '';
}
function endGame(result, reason) {
  if (!match || match.result) return;
  match.result = result; match.reason = reason;
  cancelAI(); clockPause(); deselect(); closePromotion(true); closeDialog();
  App.review = null;
  var rec = matchRecord(true); rec.ended = Date.now();
  saveToList(rec, true); Store.del(KEY.current);
  renderHUD();
  var winner = result === '1-0' ? C.WHITE : result === '0-1' ? C.BLACK : -1;
  var titles = { checkmate: 'CHECKMATE', stalemate: 'STALEMATE', resign: 'RESIGNATION', timeout: 'TIME OUT', timeoutDraw: 'TIME OUT' };
  var title = titles[reason] || 'DRAW';
  var wait = reason === 'checkmate' || reason === 'stalemate' ? 750 / Math.max(0.5, animSpeed() || 2) : 300;
  var cine = settings.cinematic !== 'off' && !settings.reduced;
  setTimeout(function () {
    if (!match || App.mode !== 'game') return;
    setMode('result');
    Cam.resetUser();
    Cam.setGoal({ el: cine ? 1.2 : 1.05, target: [0, 0, 0], fit: true, fitPad: 1.02, speed: cine ? 0.3 : 0.7 });
    lights({ dim: reason === 'checkmate' ? 0.85 : 0.55, key: 1.5, spotInt: 0 });
    if (winner >= 0) {
      var kv = null; Scene.pieces.forEach(function (v) { if (v.type === C.KING && v.color === winner && !v.removing) kv = v; });
      if (kv) {
        Scene.spot[0].set(kv.x); Scene.spot[1].set(1.9); Scene.spot[2].set(kv.z);
        Scene.L.spotInt.set(4.5); kv.sel.set(0.75); kv.liftTarget = 0.1;
      }
    }
    Scene.L.glow.set(0); App.checkFx = null;
    $('#bigtitle-h').textContent = title;
    $('#bigtitle-p').textContent = winner >= 0 ? colorKo(winner) + ' 승리 · ' + result : '무승부 · ' + result;
    $('#bigtitle').classList.add('on');
    Sound.play(reason === 'checkmate' ? 'mate' : 'win'); haptic(30);
    setTimeout(function () {
      if (App.mode !== 'result') return;
      renderResult(rec, winner);
      $('#result').classList.add('on');
      Scene.boardScale.set(0.86);
      setTimeout(updateCamRect, 50); setTimeout(updateCamRect, 700);
    }, cine ? 1500 : 500);
  }, wait);
}
function renderResult(rec, winner) {

    '<div class="res-grid"><button class="pill primary" data-res="replay">REPLAY</button><button class="pill" data-res="analysis">경기 분석</button><button class="pill" data-res="rematch">재대결</button>' +
    '<button class="pill ghost" data-res="pgn">PGN 복사</button><button class="pill ghost" data-res="board">체스판 보기</button><button class="pill ghost" data-res="menu">메인 메뉴</button></div></div>';

// ================================================================= HUD
var hudPending = false;

var statusPending = false;
function renderStatusSoon() { if (statusPending) return; statusPending = true; setTimeout(function () { statusPending = false; renderStatus(); }, 120); }
function capturedBy() {
  // replay history to list captured piece types per capturing colour
  var p = new C.Position(match.startFen), caps = { 0: [], 8: [] };
  var upto = App.review != null ? App.review : match.moves.length;
  for (var i = 0; i < upto; i++) {
    var m = p.moveFromUci(match.moves[i]); if (!m) break;
    var d = p.describe(m); if (d.capSq >= 0) caps[p.turn].push(p.board[d.capSq] & 7);
    p.make(m);
  }
  var VAL = { 1: 1, 2: 3, 3: 3, 4: 5, 5: 9, 6: 0 }, mat = { 0: 0, 8: 0 };
  for (var s = 0; s < 120; s++) { if (s & 0x88) { s += 7; continue; } var q = p.board[s]; if (q) mat[q & 8] += VAL[q & 7]; }
  caps[0].sort(function (a, b) { return a - b; }); caps[8].sort(function (a, b) { return a - b; });
  return { caps: caps, diff: mat[0] - mat[8] };
}
function playerSub(color) {
  if (match.mode === 'ai') {
    if (color === match.human) return '플레이어 · ' + colorKo(color);
    var eng = App.aiInfo && App.aiInfo.engine ? App.aiInfo.engine : (Engines.useStockfish() ? 'stockfish' : 'noir');
    return Engines.label(eng) + ' · ' + LEVELS[match.level - 1].name;
  }
  return colorKo(color);
}
function renderCard(el, color) {

  var active = !match.result && pos.turn === color && App.review == null;

  var name = color === C.WHITE ? match.white : match.black;

  el.innerHTML = '<div class="av">' + pieceSVG(C.KING, color === C.BLACK, 30) + '</div><div class="nm">' + esc(name) + '</div><div class="clock" data-clock="' + color + '">' + (match.tc.base ? fmtClock(clockLeft(color)) : '∞') + '</div>' +
    '<div class="sub">' + esc(playerSub(color)) + (thinking ? ' <span class="thinking" aria-label="생각 중"><i></i><i></i><i></i></span>' : '') + '</div>' +
    '<div class="caps">' + caps.map(function (t) { return pieceSVG(t, color === C.WHITE, 17); }).join('') + (adv > 0 ? '<span class="adv">+' + adv + '</span>' : '') + '</div>';
  el.setAttribute('aria-label', colorKo(color) + ' ' + name);
}

  if (App.hint) {

      var last = pos.stack[pos.stack.length - 1]; App.lastMove = last && last.m !== -1 ? { from: C.mFrom(last.m), to: C.mTo(last.m) } : null;
      App.checkFx = null; Scene.L.glow.set(0);
      self.busy = false;
    }, 1300));
  },
  success: function () {
    this.done = true;
    var prog = Store.get(KEY.academy, {}); prog[this.L.id] = Date.now(); Store.set(KEY.academy, prog);
    this.renderPanel(); this.say('완벽합니다! 레슨 완료.', true);
    toast('LESSON COMPLETE'); Sound.play('win'); haptic(25);
    if (settings.cinematic !== 'off' && !settings.reduced) { Cam.setGoal({ el: 1.08 }); var self = this; this.timers.push(setTimeout(function () { if (App.mode === 'academy') Cam.setGoal({ el: 0.92 }); }, 1600)); }
  }
};

/* ==========================================================================
   CHESS NOIR — boot, events, render loop, adaptive performance
   ========================================================================== */
var Perf = { ema: 16.7, tier: 1, lowT: 0, highT: 0, samples: [], refresh: 16.7, fpsAcc: 0, fpsN: 0, fpsT: 0 };
var lastT = 0, frameN = 0;

function loop(t) {
  requestAnimationFrame(loop);
  var dt = lastT ? Math.min(window.NOIR_DTCAP || 0.05, (t - lastT) / 1000) : 1 / 60; lastT = t;
  if (dt <= 0) return;
  frameN++;
  try {
    introTick(dt);
    if (App.mode === 'game') { checkFlag(); if ((frameN & 3) === 0) updateClocks(); }
    if ((frameN % 6) === 0) updateCamRect();
    if (App.pendingPromo && (frameN & 1)) placePromo();
    if ((frameN % 4) === 0) document.documentElement.style.setProperty('--sheen', ((Cam.curAz || 0) * 57.3 + 135).toFixed(1) + 'deg');
    resizeCanvas();
    Scene.frame(dt, buildDecals());
  } catch (e) {
    console.error(e);
    if (!loop.err) { loop.err = true; fatal('렌더링 중 오류가 발생했습니다: ' + e.message); }
  }
  perfTick(dt);
}
function perfTick(dt) {
  var ms = dt * 1000;
  if (Perf.samples.length < 45) { Perf.samples.push(ms); if (Perf.samples.length === 45) { var s = Perf.samples.slice().sort(function (a, b) { return a - b; }); Perf.refresh = Math.max(6.9, Math.min(34, s[8])); } }
  Perf.ema = Perf.ema * 0.94 + ms * 0.06;
  Perf.fpsAcc += ms; Perf.fpsN++;
  if (Perf.fpsAcc > 500) {
    if (settings.fps) $('#fps').textContent = Math.round(1000 * Perf.fpsN / Perf.fpsAcc) + ' fps · Q' + Scene.quality.tier + ' · ' + Math.round(Scene.quality.scale * 100) + '%';
    Perf.fpsAcc = 0; Perf.fpsN = 0;
  }
  if (settings.quality !== 'auto' || Perf.samples.length < 45 || document.hidden) return;
  var target = Math.max(Perf.refresh, 8.3);
  if (Perf.ema > Math.max(target * 1.3, 17.5)) { Perf.lowT += dt; Perf.highT = 0; } else if (Perf.ema < target * 1.08) { Perf.highT += dt; Perf.lowT = 0; } else { Perf.lowT = Math.max(0, Perf.lowT - dt); }
  if (Perf.lowT > 1.4 && Perf.tier < 4) { Perf.tier++; Scene.setQualityTier(Perf.tier); Perf.lowT = 0; Perf.ema = target; }
  if (Perf.highT > 7 && Perf.tier > 0) { Perf.tier--; Scene.setQualityTier(Perf.tier); Perf.highT = 0; }
}

function boot() {
  updateOrientation();
  try {
    resizeCanvas();
    Scene.init($('#gl'));
  } catch (e) {
    fatal('이 브라우저에서 WebGL2를 사용할 수 없어 3D 체스판을 표시할 수 없습니다. 최신 Chrome 또는 Samsung Internet에서 실행해 주세요. (' + e.message + ')');
    return;
  }
  Perf.tier = settings.quality === 'high' ? 0 : settings.quality === 'balanced' ? 2 : settings.quality === 'battery' ? 3 : 1;
  Scene.setQualityTier(Perf.tier); lastQuality = settings.quality;
  Scene.setTheme(settings.theme, true);
  applySettings(true);
  Engines.init();
  buildGeometry();
  setupIntro();

  var cv = $('#gl');
  cv.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerCancel);
  cv.addEventListener('wheel', function (e) { if (!canCamera()) return; e.preventDefault(); var z = clamp(Cam.uZoom.t * (1 + e.deltaY * 0.0012), 0.62, 1.6); Cam.uZoom.set(z); Cam.uZoomUser = z; }, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  cv.addEventListener('webglcontextlost', function (e) { e.preventDefault(); saveCurrent(); fatal('그래픽 컨텍스트가 손실되었습니다. 진행 중인 대국은 저장되었습니다.'); });
  $('#intro').addEventListener('pointerup', function (e) { if (e.target.closest('button')) return; if (App.mode === 'intro') introTap(e); });
  $('#btn-play').addEventListener('click', function (e) { e.stopPropagation(); leaveIntro(); });
  $('#btn-skip').addEventListener('click', function (e) { e.stopPropagation(); Sound.init(); gotoIntro(INTRO.length - 1); });
  $('#menu-sheet').addEventListener('click', onMenuClick);
  $('#menu-sheet').addEventListener('input', onMenuInput);
  $('#hud').addEventListener('click', onHudClick);
  $('#btn-moves-toggle').addEventListener('click', function (e) { e.stopPropagation(); $('#moves').classList.toggle('open'); setTimeout(updateCamRect, 650); });
  $('#overlay').addEventListener('click', onOverlayClick);
  $('#overlay').addEventListener('input', function (e) { if (e.target.dataset.range) handleRange(e.target); });
  $('#promo').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) choosePromotion(+b.dataset.promo); });
  $('#result').addEventListener('click', onResultClick);
  $('#bar').addEventListener('click', onViewerClick); $('#bar').addEventListener('input', onViewerInput);
  $('#side').addEventListener('click', onViewerClick); $('#side').addEventListener('input', onViewerInput);
  $('#side').addEventListener('pointerdown', onGraphPointer);
  $('#lesson-sheet').addEventListener('click', function (e) { Academy.onClick(e); });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', function () { updateOrientation(); resizeCanvas(); updateCamRect(); setTimeout(updateCamRect, 300); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { updateOrientation(); resizeCanvas(); updateCamRect(); }, 200); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (App.mode === 'game' && match && !match.result) { saveCurrent(); if (!App.overlayOpen) openPause(); }
      if (Viewer.playing) Viewer.pause();
    }
  });
  window.addEventListener('pagehide', function () { if (App.mode === 'game') saveCurrent(); });
  setInterval(function () { if (App.mode === 'game' && match && !match.result && !App.paused) saveCurrent(); }, 5000);
  requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

window.__NOIR = { App: App, Scene: Scene, Cam: Cam, Engines: Engines, Academy: Academy, Viewer: Viewer, LESSONS: LESSONS, get pos(){ return pos; }, get match(){ return match; }, commitMove: commitMove, tryUserMove: tryUserMove, select: select, settings: settings, Store: Store, endGame: endGame };
})();</script>
